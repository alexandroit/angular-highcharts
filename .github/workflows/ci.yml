name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  package:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.22.3, 24.20.0]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - name: Validate compatibility fixture catalog
        if: matrix.node == '22.22.3'
        run: npm run test:fixtures
      - run: npm run check
      - run: npm audit --audit-level=low

  browser:
    name: Angular 22 and Highcharts 13 browser contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run build
      - run: npm ci --prefix docs-src/angular-22
      - run: npm run test:docs:candidate
      - run: npm run build:docs:angular-22
        env:
          STACKLINE_HIGHCHARTS_CANDIDATE: '1'
      - run: npm run test:browser

  artifact:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm install --global npm@11.19.0
      - run: npm ci
      - run: npm run check
      - run: node --test scripts/registry-requests.test.mjs
      - run: mkdir artifact
      - run: npm pack --pack-destination "$GITHUB_WORKSPACE/artifact"
        working-directory: dist
      - run: sha512sum artifact/*.tgz > artifact/SHA512SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: npm-package
          path: artifact/
          if-no-files-found: error
